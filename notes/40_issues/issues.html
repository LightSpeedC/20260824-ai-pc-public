<style>
:root {

	--line: #d9dfe8;
	--code-bg: #f4f6fa;
	--accent: var(--navy1);
	--accent2: var(--navy2);
	--soft: #f2f5fb;
}
/* 章(h1)が1個のため、ミニタイトルバー配下の項目見出しに虹色を割り当てる */
.ch01 { --accent: hsl(280,78%,25%); --accent2: hsl(280,58%,55%); --soft: hsl(280,28%,95%); }

* { box-sizing: border-box; }
body {
	margin: 0;
	background: #fff;
	color: var(--ink);
	font-size: 15.5px;
	line-height: 1.85;
	font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
}
.titlebar {
	background: linear-gradient(135deg, var(--navy1), var(--navy2));
	color: #fff;
	padding: 34px 30px 30px;
}
.titlebar .inner { max-width: 1600px; margin: 0 auto; }
.titlebar h1 { font-size: 2.05em; margin: 0 0 8px; color: #fff; line-height: 1.35; }
.titlebar p { margin: 4px 0 0; color: #d6e2ff; font-size: 0.95em; }

.wrap { max-width: 1600px; margin: 0 auto; padding: 0 30px 40px; }
.homelink {
	display: inline-flex;
	align-items: center;
	background: linear-gradient(100deg, var(--navy1), var(--navy2));
	color: #fff;
	text-decoration: none;
	padding: 7px 14px;
	border-radius: 6px;
	box-shadow: 0 2px 9px rgba(0,0,0,0.15);
}
.homebar { margin: 18px 0 0; }

section {
	background: linear-gradient(180deg, var(--soft), #fff);
	border: 1px solid var(--line);
	border-radius: 10px;
	padding: 4px 26px 26px;
	margin: 34px 0;
}
section h1 {
	background: linear-gradient(100deg, var(--accent), var(--accent2));
	color: #fff;
	font-size: 1.5em;
	padding: 14px 20px;
	margin: 26px 0 20px;
	border-radius: 8px;
	box-shadow: 0 5px 16px rgba(0,0,0,0.18);
}
details { margin: 12px 0; }
summary {
	cursor: pointer;
	font-weight: 700;
	color: var(--accent);
	background: linear-gradient(90deg, var(--soft), #fff);
	border-left: 6px solid var(--accent);
	padding: 6px 12px;
}
.no { color: var(--ink-soft); background: none; font-weight: 400; margin: 0 6px; }
p { margin: 10px 0; }
ul { margin: 10px 0; padding-left: 1.6em; }
li { margin: 4px 0; }
a { color: #1a4fa0; }

.badge {
	display: inline-block;
	color: #fff;
	padding: 2px 10px;
	border-radius: 999px;
	font-size: 0.84em;
	font-weight: 700;
	white-space: nowrap;
}
.b-ok { background: linear-gradient(100deg,#1d7a3c,#45b56c); }
.b-none { background: linear-gradient(100deg,#5a6472,#97a1ae); }
.b-warn { background: linear-gradient(100deg,#b8620a,#f0a548); }

footer {
	max-width: 1600px;
	margin: 0 auto;
	padding: 18px 30px 40px;
	font-size: 0.95em;
}
</style>
